<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ちょっとだけ庭</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap');

:root{
  --bg:#f7efe3;
  --ink:#5b554d;
  --paper:#fffaf3;
  --green:#5f9b67;
  --green2:#7eb57e;
  --line:#e8dccb;
  --shadow:0 6px 20px rgba(91,85,77,.12);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink)
}

body{
  font-family:"M PLUS Rounded 1c","Cook Hand","Comic Sans MS",cursive,sans-serif;
  font-weight:500;
  overscroll-behavior:none
}

button{
  font:inherit;
  color:inherit;
  border:0;
  background:none
}

.app{
  width:min(100%,560px);
  margin:auto;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column
}

.top{
  padding:calc(4px + env(safe-area-inset-top)) 16px 4px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.title{
  font-size:23px;
  font-weight:800;
  letter-spacing:.04em
}

.water{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 12px;
  box-shadow:var(--shadow);
  font-size:15px;
  white-space:nowrap;
  font-weight:700
}

.water span{
  font-size:18px
}

.garden{
  position:relative;
  width:100%;
  flex:1 1 auto;
  min-height:160px;
  overflow:hidden;
  background:#5bbf55 url("assets/garden-sky-grass.jpg") center top/cover no-repeat;
  border-radius:22px;
  box-shadow:var(--shadow);
  touch-action:none;
  user-select:none
}

.garden::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.04),
    rgba(255,255,255,.02)
  )
}

.flower{
  position:absolute;
  z-index:2;
  width:68px;
  height:68px;
  display:grid;
  place-items:center;
  font-size:47px;
  cursor:grab;
  touch-action:none;
  filter:drop-shadow(0 3px 2px rgba(60,80,45,.18));
  transform:translate(-50%,-50%);
  transition:filter .2s
}

.flower:active{
  cursor:grabbing
}

.flower .pot{
  position:absolute;
  top:43px;
  font-size:23px;
  z-index:-1
}

.dog{
  position:absolute;
  transform:translate(-50%,-100%);
  cursor:pointer;
  touch-action:none;
  filter:drop-shadow(0 3px 2px rgba(60,80,45,.2))
}

.dog.away{
  display:none
}

.arrive-dog{
  width:140px;
  max-width:60%;
  display:block;
  margin:0 auto 12px;
  filter:drop-shadow(0 5px 5px rgba(60,80,45,.18))
}

#dogArrive.show{
  animation-duration:2.8s
}

.dog img{
  width:100%;
  display:block;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none
}

.dog-anim.walking{
  animation:dogBob .56s ease-in-out infinite
}

.dog-anim.jump{
  animation:dogJump .9s ease-out
}

@keyframes dogBob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3%)}
}

@keyframes dogJump{
  0%{transform:translateY(0) scale(1,1)}
  12%{transform:translateY(0) scale(1.06,.92)}
  40%{transform:translateY(-28%) scale(.97,1.04)}
  60%{transform:translateY(0) scale(1.05,.95)}
  76%{transform:translateY(-13%)}
  100%{transform:translateY(0) scale(1,1)}
}

.heart{
  position:absolute;
  z-index:999;
  font-size:20px;
  pointer-events:none;
  animation:heartUp 1s ease-out forwards
}

@keyframes heartUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.5)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--hx)),-50px) scale(1.2)}
}

.empty-garden{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:white;
  text-shadow:0 2px 5px rgba(0,0,0,.25);
  font-size:17px;
  z-index:1;
  pointer-events:none
}

main{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch
}

/* 庭画面：画面内に収める（庭が余った高さを使う） */
#view-garden.active{
  display:flex;
  flex-direction:column;
  height:100%
}

#view-garden .panel{
  flex:none;
  padding:8px 16px 4px
}

#view-garden .card{
  padding:10px 14px
}

#view-garden .section-title{
  font-size:16px;
  margin:0 0 4px
}

#view-garden .capture-btn{
  margin-top:6px;
  padding:10px
}

.panel{
  padding:4px 16px 0
}

.view{
  display:none
}

.view.active{
  display:block
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow)
}

.grow-card{
  text-align:center
}

.day-flower{
  font-size:82px;
  line-height:1.05;
  display:block;
  margin:4px auto 6px
}

.stage{
  font-size:14px;
  opacity:.8
}

.progress-wrap{
  height:11px;
  background:#eadfce;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0 9px
}

.progress{
  height:100%;
  background:var(--green2);
  border-radius:99px;
  width:0;
  transition:width .4s ease
}

.progress-text{
  font-size:14px;
  font-weight:700
}

.water-btn{
  margin-top:15px;
  width:100%;
  padding:13px 16px;
  border-radius:14px;
  background:#75ad78;
  color:white;
  font-size:18px;
  font-weight:800;
  box-shadow:0 4px 0 #558e5d
}

.water-btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #558e5d
}

.water-btn:disabled{
  opacity:.45;
  box-shadow:none
}

.hint{
  font-size:13px;
  opacity:.65;
  margin:10px 0 0
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:4px 0 12px
}

.friends-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:22px
}

.friend-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
  cursor:pointer;
  text-align:center
}

.friend-card:active{
  transform:scale(.97)
}

.friend-thumb{
  aspect-ratio:1/1;
  padding:10px;
  display:grid;
  place-items:center
}

.friend-thumb img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none
}

.friend-name{
  padding:0 6px 10px;
  font-size:14px;
  font-weight:700
}

.modal.friend img{
  width:55%;
  max-width:220px;
  margin:4px auto 0
}

.album-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.album-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
  cursor:pointer
}

.album-thumb{
  aspect-ratio:1/1;
  background:#ddd center/cover no-repeat
}

.album-info{
  padding:9px 11px;
  font-size:13px
}

.empty{
  padding:36px 12px;
  text-align:center;
  opacity:.65
}

.collection{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.collection-item{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 3px;
  text-align:center
}

.collection-item .emoji{
  font-size:31px
}

.collection-item .count{
  font-size:12px;
  margin-top:2px
}

.bottom{
  margin-top:auto;
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  background:var(--bg)
}

.nav-btn{
  padding:6px 6px;
  border-radius:15px;
  font-size:14px;
  font-weight:700;
  opacity:.62
}

.nav-btn.active{
  background:var(--paper);
  opacity:1;
  box-shadow:var(--shadow);
  border:1px solid var(--line)
}

.nav-icon{
  font-size:22px;
  display:block;
  margin-bottom:1px
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translate(-50%,20px);
  z-index:20;
  background:rgba(65,64,59,.9);
  color:white;
  padding:9px 15px;
  border-radius:999px;
  font-size:16px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.burst{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:30;
  pointer-events:none;
  font-size:28px;
  font-weight:500;
  opacity:0
}

.burst.show{
  animation:burst 900ms ease-out forwards
}

@keyframes burst{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.7)
  }
  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08)
  }
  100%{
    opacity:0;
    transform:translate(-50%,-70%) scale(1)
  }
}
.grow-complete{
  position:fixed;
  left:50%;
  top:50%;
  width:min(86vw,380px);
  padding:28px 20px 25px;
  transform:translate(-50%,-50%) scale(.55);
  z-index:50;
  background:rgba(255,250,243,.98);
  border:2px solid var(--line);
  border-radius:28px;
  box-shadow:0 15px 50px rgba(60,50,40,.25);
  text-align:center;
  pointer-events:none;
  opacity:0;
}

.grow-complete.show{
  animation:growComplete 2s ease-out forwards
}

.complete-flower{
  font-size:108px;
  line-height:1;
  margin-bottom:14px;
  filter:drop-shadow(0 5px 5px rgba(60,80,45,.18));
}

.complete-text{
  font-size:22px;
  font-weight:800;
  line-height:1.4
}

@keyframes growComplete{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.55)
  }

  16%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.12)
  }

  28%{
    transform:translate(-50%,-50%) scale(1)
  }

  78%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1)
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.94)
  }

}
.spark{
  position:fixed;
  z-index:29;
  pointer-events:none;
  font-size:20px;
  animation:spark 850ms ease-out forwards
}

@keyframes spark{
  0%{
    opacity:0;
    transform:translate(0,0) scale(.5)
  }
  20%{
    opacity:1
  }
  100%{
    opacity:0;
    transform:translate(var(--dx),var(--dy)) scale(1.2)
  }
}

/* 水やり時のフルフル
   day-flower は margin:auto で中央配置しているため、
   translate(-50%,-50%) は使わない */
.shake{
  animation:shake .55s ease
}

@keyframes shake{
  0%,100%{
    transform:rotate(0)
  }
  20%{
    transform:rotate(-5deg)
  }
  40%{
    transform:rotate(5deg)
  }
  60%{
    transform:rotate(-3deg)
  }
  80%{
    transform:rotate(2deg)
  }
}

.modal-back{
  position:fixed;
  inset:0;
  background:rgba(40,35,28,.42);
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal-back.open{
  display:flex
}

.modal{
  width:min(100%,500px);
  max-height:85vh;
  overflow:auto;
  background:var(--paper);
  border-radius:22px;
  padding:16px;
  box-shadow:0 15px 50px rgba(0,0,0,.2)
}

.modal img{
  width:100%;
  border-radius:15px;
  display:block
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.close{
  font-size:24px;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#f0e6d7
}

.album-date{
  font-size:17px
}

.album-note{
  margin:12px 2px 2px;
  font-size:16px;
  line-height:1.6
}

.capture-btn{
  margin-top:10px;
  width:100%;
  padding:12px;
  border-radius:14px;
  background:#6d9d70;
  color:white;
  font-size:16px
}

.small{
  font-size:12px;
  opacity:.6
}


/* 音楽ボタン & ダンス */
.top-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none
}

.music-btn{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  box-shadow:var(--shadow);
  font-size:18px;
  line-height:1.3;
  font-weight:700;
  cursor:pointer;
  transition:background .2s
}

.music-btn:active{
  transform:scale(.94)
}

.music-btn.on{
  background:#dff0d8;
  border-color:#b9d9b0
}

.music-btn.on span{
  display:inline-block;
  animation:noteBounce .6s ease-in-out infinite
}

@keyframes noteBounce{
  0%,100%{transform:translateY(0) rotate(-8deg)}
  50%{transform:translateY(-3px) rotate(8deg)}
}

/* 花：中身の絵文字だけをシャカシャカ揺らす
   （.flower 本体は translate で位置決めしているので触らない） */
.flower .fl{
  display:block;
  transform-origin:50% 90%
}

.garden.dancing .flower .fl{
  animation:flowerDance var(--dt,.32s) ease-in-out infinite alternate;
  animation-delay:var(--dd,0s)
}

@keyframes flowerDance{
  0%{transform:rotate(-13deg) translateY(0) scale(1,1)}
  50%{transform:rotate(0deg) translateY(-7px) scale(1.08,.94)}
  100%{transform:rotate(13deg) translateY(0) scale(1,1)}
}

/* 犬：その場でノリノリ */
.dog-anim.dancing{
  transform-origin:50% 100%;
  animation:dogDance .6s ease-in-out infinite
}

@keyframes dogDance{
  0%,100%{transform:translateY(0) rotate(-7deg)}
  25%{transform:translateY(-12%) rotate(0deg) scale(.97,1.05)}
  50%{transform:translateY(0) rotate(7deg)}
  75%{transform:translateY(-12%) rotate(0deg) scale(.97,1.05)}
}

@media (prefers-reduced-motion:reduce){
  .garden.dancing .flower .fl{animation-duration:.8s}
  .dog-anim.dancing{animation-duration:1.4s}
}

@media (max-width:380px){
  .title{
    font-size:20px
  }

  .top-right{
    gap:6px
  }

  .music-btn{
    padding:7px 9px
  }

  .flower{
    font-size:42px
  }

  .flower .pot{
    font-size:20px
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="top">
    <div class="title">🌿 ちょっとだけ庭</div>
    <div class="top-right">
      <button class="music-btn" id="musicBtn" aria-label="音楽を再生" aria-pressed="false"><span id="musicIcon">🎵</span></button>
      <div class="water" id="waterLabel">💧 5 / 5</div>
    </div>
  </header>

  <main>

    <section class="view active" id="view-garden">
      <div class="garden" id="garden">
        <div class="empty-garden" id="emptyGarden">
          ここがあなたの庭です。花を咲かせていきましょう。
        </div>

        <div class="dog" id="dog">
          <div class="dog-flip">
            <div class="dog-anim">
              <img src="assets/dog_walk1.png" alt="犬" draggable="false">
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="card">
          <div class="section-title">📷 今日の庭</div>
          <div id="todayCaptureText">
            今日の庭を1枚残せます。
          </div>
          <button class="capture-btn" id="captureBtn">
            今日の庭を記録する
          </button>
        </div>
      </div>
    </section>

    <section class="view" id="view-grow">

      <div class="panel" style="padding-top:0">

        <div class="card grow-card">

          <div class="small" id="todayLabel"></div>

          <span class="day-flower" id="dayFlower">🌱</span>

          <div class="stage" id="stageText">
            まだ小さな芽です。
          </div>

          <div class="progress-wrap">
            <div class="progress" id="progress"></div>
          </div>

          <div class="progress-text" id="progressText">
            0 / 5 💧
          </div>

          <button class="water-btn" id="waterBtn">
            💧 水をあげる
          </button>

          <p class="hint" id="waterHint">
            水は20分に1杯回復します。
          </p>

        </div>

      </div>

    </section>

    <section class="view" id="view-album">

      <div class="panel" style="padding-top:0">

        <div class="section-title">
          🐕 庭のお友達
        </div>

        <div class="friends-grid" id="friendsGrid"></div>

        <div class="empty" id="friendsEmpty" style="padding:14px 12px 24px">
          まだお友達はいません。<br>
          花を咲かせると、誰か来るかも。
        </div>

        <div class="section-title">
          📖 庭のアルバム
        </div>

        <div class="album-grid" id="albumGrid"></div>

        <div class="empty" id="albumEmpty">
          まだ庭の写真がありません。<br>
          今日の庭を1枚残してみよう。
        </div>

      </div>

    </section>

    <section class="view" id="view-collection">

      <div class="panel" style="padding-top:0">

        <div class="section-title">
          🌷 花の図鑑
        </div>

        <div class="collection" id="collection"></div>

      </div>

    </section>

  </main>

  <nav class="bottom">

    <button class="nav-btn active" data-view="garden">
      <span class="nav-icon">🌿</span>
      庭
    </button>

    <button class="nav-btn" data-view="grow">
      <span class="nav-icon">🪴</span>
      育てる
    </button>

    <button class="nav-btn" data-view="album">
      <span class="nav-icon">📖</span>
      アルバム
    </button>

  </nav>

</div>

<div class="toast" id="toast"></div>

<div class="burst" id="burst">
  ぽんっ！✨
</div>
<div class="grow-complete" id="growComplete">

  <div class="complete-flower" id="completeFlower">
    🌷
  </div>

  <div class="complete-text" id="completeText">
    チューリップに育ちました！
  </div>

</div>
<div class="grow-complete" id="dogArrive">

  <img class="arrive-dog" src="assets/dog_happy.png" alt="コロちゃん" draggable="false">

  <div class="complete-text">
    コロちゃんがやってきました！
  </div>

</div>
<div class="modal-back" id="modalBack">

  <div class="modal" id="modalBox">

    <div class="modal-head">
      <div class="album-date" id="modalDate"></div>
      <button class="close" id="closeModal">×</button>
    </div>

    <img id="modalImg" alt="庭の記録">

    <div class="album-note" id="modalNote"></div>

  </div>

</div>

<script>

const FLOWERS = [

  {
    id:"tulip",
    emoji:"🌷",
    name:"チューリップ",
    water:4,
    note:"今日は、ゆっくりひらいた。"
  },

  {
    id:"sunflower",
    emoji:"🌻",
    name:"ひまわり",
    water:8,
    note:"ひなたのほうを向いている。"
  },

  {
    id:"rose",
    emoji:"🌹",
    name:"バラ",
    water:10,
    note:"少しずつ、きれいになっていく。"
  },

  {
    id:"sakura",
    emoji:"🌸",
    name:"さくら",
    water:7,
    note:"今日は空がきれい。"
  },

  {
    id:"daisy",
    emoji:"🌼",
    name:"デイジー",
    water:4,
    note:"小さくても、ちゃんと咲く。"
  },

  {
    id:"lavender",
    emoji:"🪻",
    name:"ラベンダー",
    water:6,
    note:"風がふわっと通り抜けた。"
  },

  {
    id:"hibiscus",
    emoji:"🌺",
    name:"ハイビスカス",
    water:9,
    note:"今日はちょっと元気。"
  },

  {
    id:"lotus",
    emoji:"🪷",
    name:"ハス",
    water:12,
    note:"静かな一日になった。"
  },

  {
    id:"blossom",
    emoji:"🏵️",

const STORAGE = "chotto_dake_garden_v1";

const today = () =>
  new Date().toLocaleDateString("sv-SE");

const defaultState = () => ({
  water:5,
  lastWaterAt:Date.now(),
  daily:null,
  flowers:[],
  albums:[],
  nextPos:0,
  dogArrived:false,
  bag:null
});

let state = load();


function load(){

  try{

    return {
      ...defaultState(),
      ...JSON.parse(
        localStorage.getItem(STORAGE)||"{}"
      )
    };

  }catch(e){

    return defaultState();

  }

}


function save(){

  localStorage.setItem(
    STORAGE,
    JSON.stringify(state)
  );

}


function refillWater(){

  const now=Date.now();

  if(state.water>=5){

    state.water=5;
    state.lastWaterAt=now;
    return;

  }

  const elapsed =
    now-state.lastWaterAt;

  const gained =
    Math.floor(
      elapsed/(20*60*1000)
    );

  if(gained>0){

    state.water =
      Math.min(
        5,
        state.water+gained
      );

    state.lastWaterAt +=
      gained*20*60*1000;

    if(state.water>=5){

      state.lastWaterAt=now;

    }

  }

  save();

}


/*
  次に育てる花を選ぶ。

  ・プレイ開始後の最初の花は必ずチューリップ
  ・1周目だけ「くじ引き方式」：10種が全部1回ずつ出る
  ・10種そろったあとは、完全ランダム
*/
function pickNextFlower(lastId){

  const first = FLOWERS[0]; // チューリップ

  if(state.flowers.length===0){

    state.bag =
      shuffle(
        FLOWERS
          .filter(f=>f.id!==first.id)
          .map(f=>f.id)
      );

    return first;

  }

  /* くじ引き用データがない古いセーブは、ここから1周分だけ始める */
  if(!Array.isArray(state.bag)){

    state.bag =
      shuffle(
        FLOWERS.map(f=>f.id)
      );

  }

  /* くじが残っている間（1周目）は、重ならずに出す */
  if(state.bag.length){

    const id = state.bag.pop();

    return FLOWERS.find(
      f=>f.id===id
    ) || FLOWERS[0];

  }

  /* 1周終わったあとは完全ランダム */
  return FLOWERS[
    Math.floor(
      Math.random()*FLOWERS.length
    )
  ];

}

function shuffle(arr){

  const a=arr.slice();

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

function ensureDaily(){

  const d=today();

  /*
    まだ1輪も咲かせていないのに、
    チューリップ以外が植わっている古いデータは
    最初の花をチューリップに直す
  */
  if(
    state.daily &&
    state.flowers.length===0 &&
    state.daily.progress===0 &&
    state.daily.flowerId!==FLOWERS[0].id
  ){

    pickNextFlower(null);

    state.daily.flowerId=
      FLOWERS[0].id;

    save();

  }

  /*
    今育てている花がなければ
    新しい花を選ぶ。

    花が咲いたときは water() の中で
    次の花をすぐに作る。
  */

  if(!state.daily){

    const flower =
      pickNextFlower(null);

    state.daily={
      date:d,
      flowerId:flower.id,
      progress:0,
      done:false
    };

    save();

  }

}


function flower(){

  return FLOWERS.find(
    f=>f.id===state.daily.flowerId
  ) || FLOWERS[0];

}


function waterRemainingMinutes(){

  if(state.water>=5) return 0;

  const passed =
    Date.now()-state.lastWaterAt;

  const left =
    20*60*1000-
    (
      passed%(20*60*1000)
    );

  return Math.max(
    1,
    Math.ceil(left/60000)
  );

}


function stageText(f){

  const p=state.daily.progress;
  const max=f.water;
  const ratio=p/max;

  if(ratio<=0)
    return "まだ小さな芽です。";

  if(ratio<.34)
    return "芽がちょっと伸びました。";

  if(ratio<.67)
    return "葉っぱがふえてきました。";

  return "もうすぐ開きそうです。";

}

function getPosition(index){

  const positions=[

    [20,30],
    [50,24],
    [79,31],
    [32,53],
    [68,50],
    [17,73],
    [52,70],
    [84,72],
    [39,86],
    [70,88],
    [10,48],
    [91,50],
    [56,40],
    [27,91],
    [76,15]

  ];

  return positions[
    index%positions.length
  ];

}


function renderGarden(){

  const g =
    document.getElementById("garden");

  g.querySelectorAll(
    ".flower"
  ).forEach(
    x=>x.remove()
  );

  const empty =
    document.getElementById(
      "emptyGarden"
    );

  empty.style.display =
    state.flowers.length
      ? "none"
      : "grid";

  state.flowers.forEach(
    (item,i)=>{

      const el =
        document.createElement("div");

      el.className="flower";

      el.dataset.id=item.uid;

      /* ダンス用：花ごとにタイミングと速さをずらす */
      el.style.setProperty(
        "--dd",
        (-(i*0.137)%0.5).toFixed(2)+"s"
      );
      el.style.setProperty(
        "--dt",
        (0.28+(i%3)*0.045).toFixed(3)+"s"
      );

      el.style.zIndex =
        10+Math.round(
          item.y ?? getPosition(i)[1]
        );

      el.style.left =
        (item.x ??
        getPosition(i)[0])+
        "%";

      el.style.top =
        (item.y ??
        getPosition(i)[1])+
        "%";

      el.innerHTML =
        `<span class="fl">${item.emoji}</span>
         <span class="pot">🪴</span>`;

      g.appendChild(el);

      dragFlower(el,item);

    }
  );

}


function dragFlower(el,item){

  let dragging=false;

  const move=e=>{

    if(!dragging)return;

    const r =
      document
        .getElementById("garden")
        .getBoundingClientRect();

    const p =
      e.touches
        ? e.touches[0]
        : e;

    item.x =
      Math.max(
        7,
        Math.min(
          93,
          (p.clientX-r.left)/
          r.width*100
        )
      );

    item.y =
      Math.max(
        10,
        Math.min(
          90,
          (p.clientY-r.top)/
          r.height*100
        )
      );

    el.style.left =
      item.x+"%";

    el.style.top =
      item.y+"%";

  };

  const up=()=>{

    if(dragging){

      dragging=false;

      save();

      document.removeEventListener(
        "pointermove",
        move
      );

      document.removeEventListener(
        "pointerup",
        up
      );

    }

  };

  el.addEventListener(
    "pointerdown",
    e=>{

      dragging=true;

      el.setPointerCapture?.(
        e.pointerId
      );

      document.addEventListener(
        "pointermove",
        move
      );

      document.addEventListener(
        "pointerup",
        up
      );

    }
  );

}


function water(){

  refillWater();
  ensureDaily();

  if(state.water<=0)return;

  state.water--;
  state.daily.progress++;

  const f=flower();

  const emoji =
    document.getElementById(
      "dayFlower"
    );

  /*
    フルフル。
    中央配置はCSS側で行っているので、
    animationではrotateだけを使う。
  */

  emoji.classList.remove(
    "shake"
  );

  void emoji.offsetWidth;

  emoji.classList.add(
    "shake"
  );

  showBurst("ぽたっ 💧");

  if(
  state.daily.progress>=f.water
){

  state.daily.progress=f.water;
  state.daily.done=true;

  /*
    咲いた花を庭へ追加
  */

  state.flowers.push({

    uid:
      crypto.randomUUID?.() ||
      String(Date.now()),

    emoji:f.emoji,
    name:f.name,
    date:today(),
    x:null,
    y:null

  });

  save();
  updateUI();

  /*
    花が育ちきった達成演出
  */

  showGrowComplete(f);
  showBurst("ぽんっ！✨");
  sparkle();

  /*
    最初の花が咲いたら、
    達成ポップアップのあとにコロちゃん登場
  */
  if(!state.dogArrived){
    state.dogArrived=true;
    save();
    setTimeout(()=>{
      showDogArrive();
      sparkle();
      window.arriveDog&&window.arriveDog();
    },2100);
  }

  /*
    ポップアップが終わってから
    次の花を出す
  */

  setTimeout(()=>{

    const nextFlower =
      pickNextFlower(
        f.id
      );

    state.daily={

      date:today(),

      flowerId:
        nextFlower.id,

      progress:0,

      done:false

    };

    save();
    updateUI();

  },2000);


  }else{

    save();
    updateUI();

  }

}

function renderSnapshot(){

  return new Promise(
    resolve=>{

      const w=900;
      const h=1200;

      const c =
        document.createElement(
          "canvas"
        );

      const ctx=c.getContext(
        "2d"
      );

      c.width=w;
      c.height=h;

      const bg =
        new Image();

      bg.onload=()=>{

        const scale =
          Math.max(
            w/bg.width,
            h/bg.height
          );

        const bw =
          bg.width*scale;

        const bh =
          bg.height*scale;

        ctx.drawImage(
          bg,
          (w-bw)/2,
          (h-bh)/2,
          bw,
          bh
        );

        ctx.fillStyle =
          "rgba(0,0,0,.08)";

        ctx.fillRect(
          0,0,w,h
        );

        ctx.fillStyle =
          "rgba(255,255,255,.9)";

        ctx.font =
          "500 42px sans-serif";

        ctx.textAlign="left";

        ctx.fillText(
          "わたしの庭",
          45,
          70
        );

        ctx.font =
          "28px sans-serif";

        ctx.fillText(
          today(),
          45,
          108
        );

        state.flowers.forEach(
          (item,i)=>{

            const x =
              (item.x ??
              getPosition(i)[0])/
              100*w;

            const y =
              (item.y ??
              getPosition(i)[1])/
              100*h;

            ctx.font =
              "64px sans-serif";

            ctx.textAlign="center";

            ctx.fillText(
              item.emoji,
              x,
              y
            );

            ctx.font =
              "28px sans-serif";

            ctx.fillText(
              "🪴",
              x,
              y+50
            );

          }
        );

        resolve(
          c.toDataURL(
            "image/jpeg",
            .82
          )
        );

      };

      bg.onerror=()=>{

        ctx.fillStyle="#5bbf55";

        ctx.fillRect(
          0,0,w,h
        );

        ctx.fillStyle =
          "rgba(255,255,255,.9)";

        ctx.font =
          "500 42px sans-serif";

        ctx.fillText(
          "わたしの庭",
          45,
          70
        );

        resolve(
          c.toDataURL(
            "image/jpeg",
            .82
          )
        );

      };

      bg.src=
        "assets/garden-sky-grass.jpg";

    }
  );

}

      facingLeft ? "scaleX(1)" : "scaleX(-1)";
    img.src=
      mode==="happy" ? HAPPY : FRAMES[frame];
    anim.classList.toggle(
      "walking",
      mode==="walk"
    );
    anim.classList.toggle(
      "dancing",
      mode==="dance"
    );
  }

  function hearts(){
    const W=garden.clientWidth;
    const H=garden.clientHeight;
    const px=x/100*W;
    const py=y/100*H-dog.offsetHeight*0.85;

    for(let i=0;i<3;i++){
      const h=document.createElement("div");
      h.className="heart";
      h.textContent=["❤️","💕","💗"][i%3];
      h.style.left=px+"px";
      h.style.top=py+"px";
      h.style.setProperty(
        "--hx",
        (i-1)*22+"px"
      );
      h.style.animationDelay=(i*0.12)+"s";
      garden.appendChild(h);
      setTimeout(()=>h.remove(),1300);
    }
  }

  dog.addEventListener("pointerdown",e=>{

    e.stopPropagation();

    /* 踊り中はそのまま踊り続けてハートだけ出す */
    if(mode==="dance"){
      hearts();
      return;
    }

    mode="happy";
    wait=1.6;
    frame=0;

    anim.classList.remove("jump");
    void anim.offsetWidth;
    anim.classList.add("jump");

    hearts();
    apply();

  });

  anim.addEventListener("animationend",e=>{
    if(e.animationName==="dogJump"){
      anim.classList.remove("jump");
    }
  });

  function tick(now){

    const dt=Math.min(.05,(now-last)/1000);
    last=now;

    const W=garden.clientWidth;
    const H=garden.clientHeight;

    /* 庭タブが見えていないときは止める */
    if(W>0){

      if(mode==="walk"){

        const dx=(tx-x)/100*W;
        const dy=(ty-y)/100*H;
        const dist=Math.hypot(dx,dy);
        const step=34*(0.7+0.3*y/100)*dt;

        if(dist<=step){
          mode="idle";
          wait=1+Math.random()*2.5;
        }else{
          x+=dx/dist*step/W*100;
          y+=dy/dist*step/H*100;
        }

        if(Math.abs(dx)>3){
          facingLeft=dx<0;
        }

        frameT+=dt;
        if(frameT>.28){
          frameT=0;
          frame^=1;
        }

      }else if(mode==="idle"){

        frame=0;
        wait-=dt;
        if(wait<=0) pick();

      }else if(mode==="dance"){

        /* その場でシャカシャカ：足を素早く入れ替え、向きも左右に */
        frameT+=dt;
        if(frameT>.16){
          frameT=0;
          frame^=1;
        }
        danceT+=dt;
        if(danceT>.45){
          danceT=0;
          facingLeft=!facingLeft;
        }

      }else if(mode==="happy"){

        wait-=dt;
        if(wait<=0){
          mode="idle";
          wait=.3;
        }

      }

      apply();

    }

    requestAnimationFrame(tick);

  }

  /* 外から呼ぶ：コロちゃん登場 */
  window.arriveDog=function(){
    dog.classList.remove("away");
    mode="happy";
    wait=1.8;
    frame=0;
    anim.classList.remove("jump");
    void anim.offsetWidth;
    anim.classList.add("jump");
    apply();
    hearts();
  };

  /* 外から呼ぶ：犬のダンスON/OFF */
  window.setDogDance=function(on){
    anim.classList.remove("jump");
    if(on){
      mode="dance";
      frame=0;
      frameT=0;
      danceT=0;
    }else{
      mode="idle";
      wait=.3;
      frame=0;
    }
    apply();
  };

  apply();
  requestAnimationFrame(tick);

})();



/* ===== 音楽 & ダンス ===== */
(function(){

  /* ★ 音楽ファイルのパスはここだけ書き換えればOK */
  const MUSIC_SRC="assets/music.mp3";

  const btn=document.getElementById("musicBtn");
  const icon=document.getElementById("musicIcon");
  const garden=document.getElementById("garden");

  const audio=new Audio();
  audio.loop=true;
  audio.preload="none";
  audio.volume=.7;

  let playing=false;
  let srcSet=false;

  function setDance(on){
    playing=on;
    garden.classList.toggle("dancing",on);
    btn.classList.toggle("on",on);
    btn.setAttribute("aria-pressed",on?"true":"false");
    btn.setAttribute("aria-label",on?"音楽を止める":"音楽を再生");
    icon.textContent=on?"🎶":"🎵";
    window.setDogDance&&window.setDogDance(on);
  }

  btn.addEventListener("click",async()=>{

    if(playing){
      audio.pause();
      setDance(false);
      return;
    }

    /* 先に踊り始める（音楽ファイルが無くても動きは確認できる） */
    setDance(true);

    try{
      if(!srcSet){
        audio.src=MUSIC_SRC;
        srcSet=true;
      }
      await audio.play();
    }catch(e){
      toast("無音声でダンス中！");
    }

  });

})();


setInterval(
  updateUI,
  30000
);

updateUI();

</script>
